name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'native-webview/**'
      - 'pano-native-components/**'

jobs:
  build:
    name: Build libs

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2025-vs2026, ubuntu-24.04, ubuntu-24.04-arm]
        include:
        - os: windows-2025-vs2026
          resources-dir: windows-x64
        - os: ubuntu-24.04
          resources-dir: linux-x64
        - os: ubuntu-24.04-arm
          resources-dir: linux-arm64

    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libwebkitgtk-6.0-dev

    - run: cargo update && cargo build --release

    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: libs-${{ matrix.resources-dir }}
        path: |
          target/release/libpano_native_components.so
          target/release/libnative_webview.so
          target/release/pano_native_components.dll
          target/release/native_webview.dll