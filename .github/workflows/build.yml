name: Build

on: [workflow_dispatch]

jobs:
  build:
    name: Build libs

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2025-vs2026, ubuntu-22.04, ubuntu-24.04-arm, macos-14]
        include:
        - os: windows-2025-vs2026
          resources-dir: windows-x64
        - os: ubuntu-22.04
          resources-dir: linux-x64
        - os: ubuntu-24.04-arm
          resources-dir: linux-arm64
        - os: macos-14
          resources-dir: macos-arm64

    steps:
    - uses: actions/checkout@v6

    - uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libwebkitgtk-6.0-dev

    - run: cargo update && cargo build --release

    - name: Upload binary
      if: runner.os != 'macOS'
      uses: actions/upload-artifact@v6
      with:
        name: libs-${{ matrix.resources-dir }}
        path: |
          target/release/libpano_native_components.so
          target/release/libnative_webview.so
          target/release/pano_native_components.dll
          target/release/native_webview.dll

    # macOS: stage the dylib and the MediaRemote adapter in one dir so the
    # artifact unpacks flat into composeApp/resources/macos-arm64/
    - name: Build MediaRemote adapter and stage macOS libs
      if: runner.os == 'macOS'
      run: |
        ./build-macos-adapter.sh stage/mediaremote-adapter
        cp target/release/libpano_native_components.dylib stage/

    - name: Upload binary (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v6
      with:
        name: libs-${{ matrix.resources-dir }}
        path: stage/
