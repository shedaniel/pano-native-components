[package]
name = "native-webview"
version = "0.1.0"
edition = "2024"


[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows-webview = "0.100"
windows-window = "0.100"

[target.'cfg(target_os = "linux")'.dependencies]
webkit6 = "0.6"
gtk4 = { version = "0.11", features = ["v4_10"] }
async-channel = "2"
