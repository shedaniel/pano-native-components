[package]
name = "pano-native-components"
version = "0.1.0"
edition = "2024"


[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.52", features = ["rt", "sync", "macros", "time"] }
interprocess = { version = "2.4", features = ["tokio"] }
discord-rich-presence = "1.1"
log = "0.4"
ftail = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.16", default-features = false, features = ["async-io"] }
futures-util = "0.3"
ksni = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
ashpd = { version = "0.13", features = [
    "file_chooser",
    "settings",
    "notification",
    "background",
    "open_uri",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Media_Control",
    "ApplicationModel",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    # "ApplicationModel_Activation",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Storage_Pickers",
    # "Win32_Storage_Packaging_Appx",
    "Storage_Streams",
    "Win32_UI_Shell",
    "System",
] }
windows-core = "0.62"
windows-registry = "0.6"
